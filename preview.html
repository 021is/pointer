<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer · preview</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main class="page wide">
  <header class="head">
    <img src="icons/icon-128.png" alt="" class="mark">
    <div>
      <p class="eyebrow">Preview</p>
      <h1>What Copy gives</h1>
    </div>
  </header>
  <p class="lead" id="summary">Loading…</p>
  <div class="actions" id="actions" hidden>
    <button type="button" id="copy-picture" class="btn">Copy the picture</button>
    <button type="button" id="copy-text" class="btn">Copy the text</button>
    <span class="note" id="done" role="status"></span>
  </div>
  <figure id="figure" hidden><img id="picture" alt="The picture Copy gives"></figure>
  <section id="text-block" hidden>
    <p class="eyebrow">Text</p>
    <pre id="text"></pre>
  </section>
  <footer class="foot">Nothing here left your browser. <a href="https://021.is/plugins/pointer">Pointer by 021</a></footer>
</main>
<script src="preview.js"></script>
</body>
</html>
