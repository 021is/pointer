name: Check

# The whole gate in one job, every step run even when an earlier one fails, so one run shows
# every failure. On every pull request to main, and on main itself (its build and store zip).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Private: 021's own runners (no billed minutes). Public: GitHub's runners, never 021's: a
    # public repo's pull requests must not run strangers' code on 021's machines.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","021"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The whole history: gitleaks reads every commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Every action is pinned to a full commit digest: a public repo never runs a movable tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        id: deps
        run: npx -y npm@11.21.1 ci --prefer-offline --no-audit --no-fund

      - name: Biome
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck
      - name: 300-line rule
        if: ${{ !cancelled() }}
        run: npm run lines
      - name: Tests (vitest)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
      - name: Upload the unpacked extension
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pointer-dist
          path: dist/
          retention-days: 14
      # The file the Chrome Web Store takes: dist's contents, the manifest at the zip's root.
      - name: Store zip
        id: zip
        if: ${{ steps.build.outcome == 'success' && !github.event.repository.private }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          (cd dist && zip -qr "../pointer-$version.zip" .)
          echo "file=pointer-$version.zip" >> "$GITHUB_OUTPUT"
      - name: Upload the store zip
        if: ${{ steps.zip.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pointer-store-zip
          path: ${{ steps.zip.outputs.file }}
          retention-days: 30

      - name: Fetch gitleaks
        id: gitleaks
        if: ${{ !cancelled() }}
        env:
          VERSION: 8.30.1
          SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        # The same checksum-verified binary as 021is/ci's check-go.yml.
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) arch=x64 sha256=$SHA256_X64 ;;
            ARM64) arch=arm64 sha256=$SHA256_ARM64 ;;
            *) echo "::error::No gitleaks pin for ${RUNNER_ARCH}."; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${arch}.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$archive" -O gitleaks > "$RUNNER_TEMP/bin/gitleaks"
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
      - name: gitleaks over the tree and the history
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bin/gitleaks" dir --redact --no-banner --ignore-gitleaks-allow .
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --ignore-gitleaks-allow .
